{% extends 'base.html' %}

{% block title %}{% if object %}Редакция на {{ object.title }}{% else %}Нова улика{% endif %}{% endblock %}

{% block content %}
<section class="case-file form-page">
    <div class="case-tab">УЛИКА</div>
    <h1>{% if object %}Редакция на улика{% else %}Нова улика{% endif %}</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'partials/_form.html' %}
        <div class="form-actions">
            <button type="submit" class="btn">{% if object %}Запази промените{% else %}Добави улика{% endif %}</button>
            <a class="btn btn-ghost" href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'evidence:list' %}{% endif %}">Отказ</a>
        </div>
    </form>
</section>
{% endblock %}
